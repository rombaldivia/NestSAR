name: patch numerical stability on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/pr-patch-stability.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Patch nestsar.py
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('nestsar.py')
          source = path.read_text(encoding='utf-8')

          marker = '''# ============================================================
          # MODELO
          # ============================================================

          class HOPEModel(nn.Module):
          '''
          helper = '''# ============================================================
          # MODELO
          # ============================================================

          def stable_l2_normalize(
              x: jnp.ndarray,
              epsilon: float = 1e-12,
          ) -> jnp.ndarray:
              """L2 normalization with finite gradients for zero vectors."""
              squared_norm = jnp.sum(jnp.square(x), axis=-1, keepdims=True)
              return x * jax.lax.rsqrt(squared_norm + epsilon)


          class HOPEModel(nn.Module):
          '''
          if 'def stable_l2_normalize(' not in source:
              if marker not in source:
                  raise RuntimeError('model marker not found')
              source = source.replace(marker, helper, 1)

          names = ('keys', 'queries', 'keys_1', 'queries_1', 'queries_2', 'keys_2')
          for name in names:
              if f'{name} = stable_l2_normalize({name})' in source:
                  continue
              pattern = re.compile(
                  rf'(?m)^(?P<indent>[ \t]*){name} = {name} / \(\n'
                  rf'[ \t]*jnp\.linalg\.norm\({name}, axis=-1, keepdims=True\) \+ 1e-6\n'
                  rf'[ \t]*\)'
              )
              source, count = pattern.subn(
                  lambda match: (
                      f"{match.group('indent')}{name} = "
                      f"stable_l2_normalize({name})"
                  ),
                  source,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError(f'normalization block not found: {name}')

          if 'return stable_l2_normalize(x)' not in source:
              pattern = re.compile(
                  r'def four_normalize_vectors\(x: jnp\.ndarray\) -> jnp\.ndarray:\n'
                  r'[ \t]*return x / \(jnp\.linalg\.norm\(x, axis=-1, keepdims=True\) \+ 1e-6\)'
              )
              source, count = pattern.subn(
                  'def four_normalize_vectors(x: jnp.ndarray) -> jnp.ndarray:\n'
                  '    return stable_l2_normalize(x)',
                  source,
                  count=1,
              )
              if count != 1:
                  raise RuntimeError('four_normalize_vectors block not found')

          old_call = '''    _, metrics = train_step(
              state,
              batch_x,
              batch_y,
              jax.random.PRNGKey(CFG.seed + 999),
          )'''
          new_call = '''    smoke_state, metrics = train_step(
              state,
              batch_x,
              batch_y,
              jax.random.PRNGKey(CFG.seed + 999),
          )'''
          if 'smoke_state, metrics = train_step(' not in source:
              if old_call not in source:
                  raise RuntimeError('smoke train_step call not found')
              source = source.replace(old_call, new_call, 1)

          old_check = '''    if not tree_all_finite(metrics):
              raise FloatingPointError("El paso físico produjo métricas no finitas.")'''
          new_check = '''    bad_metrics = [
              key
              for key, value in metrics.items()
              if not bool(np.asarray(jnp.all(jnp.isfinite(value))))
          ]
              if bad_metrics:
                  raise FloatingPointError(
                      "El paso físico produjo métricas no finitas: "
                      + ", ".join(sorted(bad_metrics))
                  )
              if not tree_all_finite(smoke_state.params):
                  raise FloatingPointError(
                      "El paso físico produjo parámetros no finitos."
                  )'''
          if 'bad_metrics = [' not in source:
              if old_check not in source:
                  raise RuntimeError('smoke finite check not found')
              source = source.replace(old_check, new_check, 1)

          source = source.replace(
              'parser.add_argument("--version", action="version", version="NestSAR 0.3.0")',
              'parser.add_argument("--version", action="version", version="NestSAR 0.3.1")',
              1,
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Verify and commit
        run: |
          python -m py_compile nestsar.py
          grep -q 'def stable_l2_normalize' nestsar.py
          grep -q 'return stable_l2_normalize(x)' nestsar.py
          grep -q 'bad_metrics = \[' nestsar.py
          grep -q 'NestSAR 0.3.1' nestsar.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/pr-patch-stability.yml
          rm -f .github/workflows/patch-v040.yml
          rm -f .github/workflows/fix-zero-gradient.yml
          git add -A
          git commit -m 'fix: stabilize zero-vector gradients in memory normalization'
          git push origin HEAD:${{ github.head_ref }}
