name: SM-ALL corrected preprocessing

on:
  push:
    branches:
      - fix/nestsar-sm-all-preprocessing-v2
  workflow_dispatch:

jobs:
  preprocessing-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU regression dependencies
        run: python -m pip install -q 'jax[cpu]==0.7.2' flax==0.11.2 optax==0.2.5 numpy==2.2.6 pytest==8.4.2 psutil==7.0.0 tqdm==4.67.1
      - name: Compile corrected wrappers
        run: |
          python -m py_compile experiments/nestsar_sm_all_t16/preprocessing_corrected.py
          python -m py_compile experiments/nestsar_sm_all_t16/train_gpu_corrected.py
          python -m py_compile experiments/nestsar_sm_all_t16/run_dual_t4_corrected.py
          python -m compileall -q experiments/nestsar_sm_all_t16/streaming
      - name: Run preprocessing, shared-cache, runtime, audit and training regression tests
        env:
          JAX_PLATFORMS: cpu
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest -q experiments/nestsar_sm_all_t16/test_preprocessing_corrected.py experiments/nestsar_sm_all_t16/streaming/tests
