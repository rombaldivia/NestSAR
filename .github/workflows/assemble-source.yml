name: assemble trainer source

on:
  push:
    branches: [feat/single-file-trainer]
    paths:
      - '.assembly/**'
      - '.github/workflows/assemble-source.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/single-file-trainer

      - name: Reconstruct and verify nestsar.py
        shell: bash
        run: |
          set -euo pipefail
          cat .assembly/raw*.b64 | base64 --decode > nestsar.py
          echo 'ad211007ae7ce6f166ac57250231ace68556e92b23cf990d2abacda20767a1f9  nestsar.py' | sha256sum --check --strict
          python -m py_compile nestsar.py
          python nestsar.py --export-source /tmp/nestsar_readable.py
          echo '8aa931b9423bbe4aaba2258563021797f738619ae6fd5f9a227ca9239dfb49d4  /tmp/nestsar_readable.py' | sha256sum --check --strict
          python -m py_compile /tmp/nestsar_readable.py

      - name: Commit verified trainer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .assembly
          rm -f .github/workflows/assemble-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add complete single-file NestSAR trainer'
          git push origin HEAD:feat/single-file-trainer
