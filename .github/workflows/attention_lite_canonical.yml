name: attention-lite-canonical

on:
  push:
    branches: [experiment/native-reframe-v1]
  workflow_dispatch:

jobs:
  canonical-selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build exact canonical sources
        run: python -m experiments.attention_lite_v1.canonical_payload.build

      - name: Run repository canonical selftest
        run: python -m experiments.attention_lite_v1.canonical_selftest
