name: fix zero-gradient normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-zero-gradient.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch numerical stability
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nestsar.py')
          source = path.read_text(encoding='utf-8')

          model_marker = '''# ============================================================
          # MODELO
          # ============================================================
          '''
          stable_helper = '''# ============================================================
          # MODELO
          # ============================================================

          def stable_l2_normalize(
              x: jnp.ndarray,
              epsilon: float = 1e-12,
          ) -> jnp.ndarray:
              """L2 normalization with finite gradients for exactly-zero vectors."""
              squared_norm = jnp.sum(jnp.square(x), axis=-1, keepdims=True)
              return x * jax.lax.rsqrt(squared_norm + epsilon)

          '''
          if 'def stable_l2_normalize(' not in source:
              if model_marker not in source:
                  raise RuntimeError('Model marker not found')
              source = source.replace(model_marker, stable_helper, 1)

          replacements = {
              '''            keys = keys / (
                  jnp.linalg.norm(keys, axis=-1, keepdims=True) + 1e-6
              )
              queries = queries / (
                  jnp.linalg.norm(queries, axis=-1, keepdims=True) + 1e-6
              )''': '''            keys = stable_l2_normalize(keys)
              queries = stable_l2_normalize(queries)''',
              '''        keys_1 = keys_1 / (
              jnp.linalg.norm(keys_1, axis=-1, keepdims=True) + 1e-6
          )
          queries_1 = queries_1 / (
              jnp.linalg.norm(queries_1, axis=-1, keepdims=True) + 1e-6
          )''': '''        keys_1 = stable_l2_normalize(keys_1)
          queries_1 = stable_l2_normalize(queries_1)''',
              '''        queries_2 = queries_2 / (
              jnp.linalg.norm(queries_2, axis=-1, keepdims=True) + 1e-6
          )
          keys_2 = keys_2 / (
              jnp.linalg.norm(keys_2, axis=-1, keepdims=True) + 1e-6
          )''': '''        queries_2 = stable_l2_normalize(queries_2)
          keys_2 = stable_l2_normalize(keys_2)''',
              '''def four_normalize_vectors(x: jnp.ndarray) -> jnp.ndarray:
              return x / (jnp.linalg.norm(x, axis=-1, keepdims=True) + 1e-6)''': '''def four_normalize_vectors(x: jnp.ndarray) -> jnp.ndarray:
              return stable_l2_normalize(x)''',
          }

          for old, new in replacements.items():
              if old not in source:
                  raise RuntimeError('Expected normalization block not found:\n' + old)
              source = source.replace(old, new)

          old_smoke = '''    _, metrics = train_step(
              state,
              batch_x,
              batch_y,
              jax.random.PRNGKey(CFG.seed + 999),
          )
          jax.block_until_ready(metrics["loss"])
          if not tree_all_finite(metrics):
              raise FloatingPointError("El paso físico produjo métricas no finitas.")'''
          new_smoke = '''    smoke_state, metrics = train_step(
              state,
              batch_x,
              batch_y,
              jax.random.PRNGKey(CFG.seed + 999),
          )
          jax.block_until_ready(metrics["loss"])
          bad_metrics = [
              key
              for key, value in metrics.items()
              if not bool(np.asarray(jnp.all(jnp.isfinite(value))))
          ]
          if bad_metrics:
              raise FloatingPointError(
                  "El paso físico produjo métricas no finitas: "
                  + ", ".join(sorted(bad_metrics))
              )
          if not tree_all_finite(smoke_state.params):
              raise FloatingPointError(
                  "El paso físico produjo parámetros no finitos."
              )'''
          if old_smoke not in source:
              raise RuntimeError('Smoke-test block not found')
          source = source.replace(old_smoke, new_smoke, 1)

          old_hash = '''    payload = {
              "model": model_id,
              "dataset_name": dataset_path.name,
              "dataset_size": dataset_path.stat().st_size,
              "config": dataclasses.asdict(CFG),
          }'''
          new_hash = '''    payload = {
              "model": model_id,
              "dataset_name": dataset_path.name,
              "dataset_size": dataset_path.stat().st_size,
              "source_sha256": sha256_file(Path(__file__).resolve()),
              "config": dataclasses.asdict(CFG),
          }'''
          if old_hash not in source:
              raise RuntimeError('Config-hash block not found')
          source = source.replace(old_hash, new_hash, 1)

          source = source.replace(
              'parser.add_argument("--version", action="version", version="NestSAR 0.3.0")',
              'parser.add_argument("--version", action="version", version="NestSAR 0.3.1")',
              1,
          )

          path.write_text(source, encoding='utf-8')
          PY

      - name: Patch CI for readable trainer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          source = path.read_text(encoding='utf-8')
          old = '''      - name: Verify readable source checksum
                run: |
                  echo "8aa931b9423bbe4aaba2258563021797f738619ae6fd5f9a227ca9239dfb49d4  nestsar.py" | sha256sum --check --strict
          '''
          new = '''      - name: Verify numerical-stability guard
                run: |
                  grep -q "def stable_l2_normalize" nestsar.py
                  grep -q "source_sha256" nestsar.py
          '''
          if old not in source:
              raise RuntimeError('Old checksum CI block not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile
        run: python -m py_compile nestsar.py

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/fix-zero-gradient.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: stabilize zero-vector gradients in memory normalization'
          git push origin HEAD:main
