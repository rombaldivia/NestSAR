name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  nestsar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile all code
        run: python -m compileall -q nestsar.py experiments

      - name: Install CPU JAX stack
        run: pip install "jax[cpu]" flax optax numpy pytest

      - name: Model builds with the expected cost
        run: |
          python - <<'EOF'
          import jax, jax.numpy as jnp
          from experiments.nestsar_r5_t16 import preprocessing as pp, worker
          from experiments.nestsar_r5_t16.config import model_kwargs, validate_config
          from experiments.nestsar_r5_t16.model import NestSARR5T16
          m = NestSARR5T16(**model_kwargs(validate_config({"variant": "graph_mr"})))
          k = jax.random.PRNGKey(0)
          p = m.init({"params": k, "dropout": k}, jnp.zeros((1, pp.FRAMES, pp.FEATURES)), training=False)["params"]
          n = sum(x.size for x in jax.tree.leaves(p))
          print("params", n, "strict MFLOPs", worker.strict_mflops("graph_mr"))
          assert abs(worker.strict_mflops("graph_mr") - 40.882816) < 1e-6
          EOF

      - name: Unit tests (resume signature, temporal ablation)
        run: python -m pytest -q experiments/nestsar_r5_t16/tests/test_resume_signature.py experiments/nestsar_r5_t16/tests/test_temporal_ablation.py
