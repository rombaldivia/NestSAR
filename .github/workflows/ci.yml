name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  readable-single-file:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile complete trainer
        run: python -m py_compile nestsar.py

      - name: Verify complete implementation is visible
        run: |
          test ! -d .source
          grep -q "class HOPEModel" nestsar.py
          grep -q "class NestSARH3Model" nestsar.py
          grep -q "class NestSAR4LModel" nestsar.py
          grep -q "def run_experiment" nestsar.py
          grep -q "def save_full_checkpoint" nestsar.py
          grep -q "def restore_full_checkpoint" nestsar.py
          grep -q "def launch_protocols" nestsar.py
          grep -q "def parse_args" nestsar.py

      - name: Verify readable source checksum
        run: |
          echo "8aa931b9423bbe4aaba2258563021797f738619ae6fd5f9a227ca9239dfb49d4  nestsar.py" | sha256sum --check --strict
